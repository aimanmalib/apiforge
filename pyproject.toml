[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apiforge"
version = "1.0.0"
description = "Multi-agent API scaffolding: describe an API in plain English, get a FastAPI project. Works with any OpenAI-compatible LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Aiman" }]
keywords = ["api", "scaffolding", "ai", "agents", "llm", "openai", "fastapi", "codegen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/aimanmalib/apiforge"
Repository = "https://github.com/aimanmalib/apiforge"
Issues = "https://github.com/aimanmalib/apiforge/issues"

[project.scripts]
apiforge = "apiforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
apiforge = ["templates/*.j2"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly so new ruff releases don't change what CI enforces.
select = ["E4", "E7", "E9", "F"]
