[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apiforge"
version = "1.0.0"
description = "8-Agent API Scaffolding Engine for any OpenAI-compatible LLM (OpenAI, OpenRouter, Ollama, MiMo)"
requires-python = ">=3.10"
keywords = ["api", "scaffolding", "ai", "agents", "llm", "openai", "fastapi", "codegen"]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.1.0"]

[project.scripts]
apiforge = "apiforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
apiforge = ["templates/*.j2"]
